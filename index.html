<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Karton VR El Takibi Prototipi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.85);
      padding: 20px;
      text-align: center;
    }
    button {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #00d084;
      color: #000;
      cursor: pointer;
    }
    #vr-container {
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    .eye {
      position: relative;
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }
    .eye:last-child { border-right: none; }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
    }
    video { display: none; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Karton VR El Takibi</h2>
    <p>Arka kamerayı açar, işaret parmağını imleç yapar ve başparmakla birleştirince (pinch) hedefi tetikler.</p>
    <button id="startBtn">Kamerayı ve VR Modunu Başlat</button>
    <div id="status">Hazır</div>
  </div>

  <div id="hud">Durum: Bekleniyor | Tıklama: 0</div>
  <video id="cam" playsinline muted></video>

  <div id="vr-container">
    <div class="eye"><canvas id="leftCanvas"></canvas></div>
    <div class="eye"><canvas id="rightCanvas"></canvas></div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const hudEl = document.getElementById("hud");
    const video = document.getElementById("cam");

    const leftCanvas = document.getElementById("leftCanvas");
    const rightCanvas = document.getElementById("rightCanvas");
    const leftCtx = leftCanvas.getContext("2d");
    const rightCtx = rightCanvas.getContext("2d");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let clicks = 0;
    let wasPinching = false;

    // Normalize edilmiş (0..1) sanal hedef konumu
    let target = { x: 0.5, y: 0.5, radius: 0.08 };

    function resizeCanvases() {
      const w = Math.floor(window.innerWidth / 2);
      const h = window.innerHeight;
      for (const c of [leftCanvas, rightCanvas]) {
        c.width = w;
        c.height = h;
      }
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    async function initMediaPipe() {
      statusEl.textContent = "El takip modeli yükleniyor...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
    }

    async function initCamera() {
      statusEl.textContent = "Arka kamera açılıyor...";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    function moveTarget() {
      target.x = 0.22 + Math.random() * 0.56;
      target.y = 0.25 + Math.random() * 0.50;
    }

    function drawEye(ctx, w, h, landmarks, isPinching, eyeOffsetX) {
      ctx.clearRect(0, 0, w, h);

      // 1. Kamera görüntüsü (passthrough)
      if (video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, w, h);
      }

      // Hafif karanlık VR overlay
      ctx.fillStyle = "rgba(0, 10, 20, 0.22)";
      ctx.fillRect(0, 0, w, h);

      // 2. Sanal hedef (IPD derinlik kayması ile)
      const tx = Math.min(Math.max(target.x + eyeOffsetX, 0.08), 0.92) * w;
      const ty = target.y * h;
      const tr = target.radius * Math.min(w, h);

      ctx.beginPath();
      ctx.arc(tx, ty, tr, 0, Math.PI * 2);
      ctx.fillStyle = isPinching ? "rgba(0, 255, 140, 0.45)" : "rgba(255, 180, 0, 0.35)";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffd000";
      ctx.stroke();

      // 3. El eklem noktaları ve işaret parmağı imleci
      if (landmarks && landmarks.length > 0) {
        const hand = landmarks[0];

        ctx.fillStyle = "rgba(0, 220, 255, 0.85)";
        for (const pt of hand) {
          const px = Math.min(Math.max(pt.x + eyeOffsetX, 0), 1) * w;
          const py = pt.y * h;
          ctx.beginPath();
          ctx.arc(px, py, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        const indexTip = hand[8];
        const ix = Math.min(Math.max(indexTip.x + eyeOffsetX, 0), 1) * w;
        const iy = indexTip.y * h;

        ctx.beginPath();
        ctx.arc(ix, iy, isPinching ? 12 : 8, 0, Math.PI * 2);
        ctx.fillStyle = isPinching ? "#00ff88" : "#ff3b5c";
        ctx.fill();
      }
    }

    function renderLoop() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const result = handLandmarker.detectForVideo(video, now);

        let isPinching = false;
        if (result.landmarks && result.landmarks.length > 0) {
          const hand = result.landmarks[0];
          const thumbTip = hand[4];
          const indexTip = hand[8];

          const dx = thumbTip.x - indexTip.x;
          const dy = thumbTip.y - indexTip.y;
          const dist = Math.hypot(dx, dy);

          // Başparmak ile işaret parmağı mesafesi eşiği
          isPinching = dist < 0.06;

          const ix = indexTip.x + 0.015;
          const iy = indexTip.y;
          const hit = Math.hypot(ix - target.x, iy - target.y) < target.radius + 0.04;

          if (isPinching && !wasPinching && hit) {
            clicks += 1;
            moveTarget();
          }
          wasPinching = isPinching;

          hudEl.textContent = `El: Görüldü | Pinch: ${isPinching ? "EVET" : "Hayır"} | Skor: ${clicks}`;
        } else {
          wasPinching = false;
          hudEl.textContent = `El: Aranıyor... | Skor: ${clicks}`;
        }

        // Sağ ve sol göz arasında hafif yatay fark (stereo derinlik hissi)
        drawEye(leftCtx, leftCanvas.width, leftCanvas.height, result.landmarks, isPinching, 0.015);
        drawEye(rightCtx, rightCanvas.width, rightCanvas.height, result.landmarks, isPinching, -0.015);
      }

      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        if (!handLandmarker) await initMediaPipe();
        await initCamera();
        ui.style.display = "none";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message + " (HTTPS/localhost ve kamera izni gerekli)";
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
