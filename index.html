<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Karton VR Net - Çift El Takibi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.92);
      padding: 24px;
      text-align: center;
    }
    #ui h2 { font-size: 24px; }
    #ui p {
      max-width: 480px;
      font-size: 16px;
      line-height: 1.5;
      color: #e2ecf8;
    }
    button {
      padding: 15px 26px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: #00d084;
      color: #000;
      cursor: pointer;
    }
    .mini-btn {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-weight: 700;
    }
    #vr-container {
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    .eye {
      position: relative;
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      background: #05080d;
    }
    .eye:first-child {
      border-right: 2px solid rgba(255, 255, 255, 0.25);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .eye-hud {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }
    .eye-controls {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 10px;
      border-radius: 12px;
      align-items: center;
      font-size: 14px;
    }
    video { display: none; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Karton VR Çift El Takibi (Net Mod)</h2>
    <p>
      Jiroskop kapatıldı, görüntü keskinleştirildi ve yazılar mercek merkezine yaklaştırıldı.
      <b>Pinch</b> ile hedefi vur veya küpü sürükle, <b>Yumruk</b> ile küpü fırlat.
    </p>
    <button id="startBtn">Kamerayı ve VR Modunu Başlat</button>
    <div id="status">Hazır</div>
  </div>

  <video id="cam" playsinline muted></video>

  <div id="vr-container">
    <div class="eye">
      <div class="eye-hud" id="hudLeft">Skor: 0 | El: 0 | Yok</div>
      <canvas id="leftCanvas"></canvas>
      <div class="eye-controls">
        <button class="mini-btn" id="ipdMinusL">-</button>
        <span class="ipdVal">IPD: 0.012</span>
        <button class="mini-btn" id="ipdPlusL">+</button>
      </div>
    </div>
    <div class="eye">
      <div class="eye-hud" id="hudRight">Skor: 0 | El: 0 | Yok</div>
      <canvas id="rightCanvas"></canvas>
      <div class="eye-controls">
        <button class="mini-btn" id="ipdMinusR">-</button>
        <span class="ipdVal">IPD: 0.012</span>
        <button class="mini-btn" id="ipdPlusR">+</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const hudLeft = document.getElementById("hudLeft");
    const hudRight = document.getElementById("hudRight");
    const video = document.getElementById("cam");

    const leftCanvas = document.getElementById("leftCanvas");
    const rightCanvas = document.getElementById("rightCanvas");
    const leftCtx = leftCanvas.getContext("2d");
    const rightCtx = rightCanvas.getContext("2d");

    const ipdVals = document.querySelectorAll(".ipdVal");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let score = 0;

    let eyeOffset = 0.012;
    const pinchThreshold = 0.062;

    let target = {
      x: 0.52,
      y: 0.45,
      vx: 0.0018,
      vy: 0.0013,
      radius: 0.072
    };

    let cube = {
      x: 0.36,
      y: 0.58,
      size: 0.12,
      grabbed: false
    };

    let prevPinching = [false, false];

    function updateIpdUI() {
      ipdVals.forEach((el) => {
        el.textContent = `IPD: ${eyeOffset.toFixed(3)}`;
      });
    }

    function changeIpd(delta) {
      eyeOffset = Math.max(0.0, Math.min(0.045, +(eyeOffset + delta).toFixed(3)));
      updateIpdUI();
    }

    document.getElementById("ipdMinusL").addEventListener("click", () => changeIpd(-0.003));
    document.getElementById("ipdPlusL").addEventListener("click", () => changeIpd(0.003));
    document.getElementById("ipdMinusR").addEventListener("click", () => changeIpd(-0.003));
    document.getElementById("ipdPlusR").addEventListener("click", () => changeIpd(0.003));
    updateIpdUI();

    function resizeCanvases() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = Math.floor(window.innerWidth / 2);
      const cssH = window.innerHeight;

      for (const [c, ctx] of [[leftCanvas, leftCtx], [rightCanvas, rightCtx]]) {
        c.width = Math.floor(cssW * dpr);
        c.height = Math.floor(cssH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    async function initMediaPipe() {
      statusEl.textContent = "El takip modeli yükleniyor...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
    }

    async function initCamera() {
      statusEl.textContent = "Arka kamera açılıyor...";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    function analyzeHand(hand) {
      const wrist = hand[0];
      const thumbTip = hand[4];
      const indexTip = hand[8];
      const middleTip = hand[12];
      const ringTip = hand[16];
      const pinkyTip = hand[20];

      const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      const isPinching = pinchDist < pinchThreshold;

      const avgTipToWrist =
        (Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y) +
          Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y) +
          Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y) +
          Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y)) / 4;

      const isFist = avgTipToWrist < 0.16;
      const gesture = isPinching ? "Pinch" : isFist ? "Yumruk" : "Açık";

      return {
        indexX: indexTip.x,
        indexY: indexTip.y,
        isPinching,
        isFist,
        gesture
      };
    }

    function updateWorld() {
      target.x += target.vx;
      target.y += target.vy;
      if (target.x < 0.28 || target.x > 0.72) target.vx *= -1;
      if (target.y < 0.3 || target.y > 0.68) target.vy *= -1;
    }

    function drawEye(ctx, landmarks, handStates, shiftX) {
      const w = Math.floor(window.innerWidth / 2);
      const h = window.innerHeight;

      ctx.clearRect(0, 0, w, h);

      // Kamera görüntüsünü en/boy oranını bozmadan ortalayarak çiz
      if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
        const vidRatio = video.videoWidth / video.videoHeight;
        const eyeRatio = w / h;
        let drawW = w;
        let drawH = h;
        let drawX = 0;
        let drawY = 0;

        if (vidRatio > eyeRatio) {
          drawW = h * vidRatio;
          drawX = (w - drawW) / 2;
        } else {
          drawH = w / vidRatio;
          drawY = (h - drawH) / 2;
        }
        ctx.drawImage(video, drawX, drawY, drawW, drawH);
      }

      // Mercek merkezine yakın güvenli bölge (kenar bozulmalarını azaltmak için)
      const safeMarginX = 0.18;
      const safeMarginY = 0.22;
      const mapX = (nx) => {
        const clamped = Math.max(0, Math.min(1, nx + shiftX));
        return (safeMarginX + clamped * (1 - safeMarginX * 2)) * w;
      };
      const mapY = (ny) => {
        const clamped = Math.max(0, Math.min(1, ny));
        return (safeMarginY + clamped * (1 - safeMarginY * 2)) * h;
      };

      // Sarı hedef
      const tx = mapX(target.x);
      const ty = mapY(target.y);
      const tr = target.radius * Math.min(w, h);

      ctx.beginPath();
      ctx.arc(tx, ty, tr, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 200, 0, 0.38)";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#ffd500";
      ctx.stroke();

      // Sürükle-bırak küp
      const cSize = cube.size * Math.min(w, h);
      const cx = mapX(cube.x) - cSize / 2;
      const cy = mapY(cube.y) - cSize / 2;

      ctx.fillStyle = cube.grabbed ? "rgba(0, 255, 145, 0.55)" : "rgba(255, 110, 35, 0.55)";
      ctx.fillRect(cx, cy, cSize, cSize);
      ctx.lineWidth = 4;
      ctx.strokeStyle = cube.grabbed ? "#00ff90" : "#ff8040";
      ctx.strokeRect(cx, cy, cSize, cSize);

      // Eller
      if (landmarks && landmarks.length > 0) {
        landmarks.forEach((hand, idx) => {
          const st = handStates[idx];

          ctx.fillStyle = idx === 0 ? "#00e5ff" : "#d088ff";
          for (const pt of hand) {
            ctx.beginPath();
            ctx.arc(mapX(pt.x), mapY(pt.y), 4.5, 0, Math.PI * 2);
            ctx.fill();
          }

          const ix = mapX(st.indexX);
          const iy = mapY(st.indexY);

          ctx.beginPath();
          ctx.arc(ix, iy, st.isPinching ? 15 : 10, 0, Math.PI * 2);
          ctx.fillStyle = st.isPinching ? "#00ff88" : "#ff3b5c";
          ctx.fill();
        });
      }
    }

    function renderLoop() {
      updateWorld();

      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const result = handLandmarker.detectForVideo(video, now);

        const handStates = [];
        let activeGesture = "Yok";

        if (result.landmarks && result.landmarks.length > 0) {
          result.landmarks.forEach((hand, idx) => {
            const st = analyzeHand(hand);
            handStates.push(st);
            if (idx === 0) activeGesture = st.gesture;

            const hitTarget =
              Math.hypot(st.indexX - target.x, st.indexY - target.y) < target.radius + 0.05;
            if (st.isPinching && !prevPinching[idx] && hitTarget) {
              score += 1;
              target.x = 0.32 + Math.random() * 0.36;
              target.y = 0.34 + Math.random() * 0.3;
            }

            const nearCube =
              Math.abs(st.indexX - cube.x) < cube.size * 0.9 &&
              Math.abs(st.indexY - cube.y) < cube.size * 0.9;

            if (st.isPinching && !prevPinching[idx] && nearCube) {
              cube.grabbed = true;
            }
            if (cube.grabbed && st.isPinching) {
              cube.x = Math.max(0.15, Math.min(0.85, st.indexX));
              cube.y = Math.max(0.15, Math.min(0.85, st.indexY));
            }
            if (!st.isPinching && cube.grabbed) {
              cube.grabbed = false;
            }

            if (st.isFist && nearCube) {
              score += 2;
              cube.x = 0.3 + Math.random() * 0.4;
              cube.y = 0.35 + Math.random() * 0.35;
              cube.grabbed = false;
            }

            prevPinching[idx] = st.isPinching;
          });

          for (let i = result.landmarks.length; i < 2; i++) {
            prevPinching[i] = false;
          }
        } else {
          prevPinching = [false, false];
          cube.grabbed = false;
        }

        const handCount = result.landmarks ? result.landmarks.length : 0;
        const hudText = `Skor: ${score} | El: ${handCount} | ${activeGesture}${cube.grabbed ? " (Tutuldu)" : ""}`;
        hudLeft.textContent = hudText;
        hudRight.textContent = hudText;

        drawEye(leftCtx, result.landmarks, handStates, eyeOffset);
        drawEye(rightCtx, result.landmarks, handStates, -eyeOffset);
      }

      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        if (!handLandmarker) await initMediaPipe();
        await initCamera();
        ui.style.display = "none";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
