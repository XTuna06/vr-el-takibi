<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Karton VR - Akıcı 3D Küp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000000;
      padding: 24px;
      text-align: center;
    }
    #ui h2 {
      font-size: 24px;
      color: #00f5a0;
    }
    #ui p {
      max-width: 440px;
      font-size: 16px;
      line-height: 1.5;
      color: #d8e2ee;
    }
    button {
      padding: 15px 30px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      background: #00f5a0;
      color: #000000;
      cursor: pointer;
    }
    #vr-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      background: #000000;
    }
    .eye {
      position: relative;
      width: 50vw;
      height: 100dvh;
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lens-mask {
      position: relative;
      width: min(70vw, 75dvh);
      height: min(70vw, 75dvh);
      border-radius: 50%;
      overflow: hidden;
      background: #000000;
      box-shadow: 0 0 0 999px #000000;
      transform: translateZ(0);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
    }
    video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Karton VR - Akıcı 3D Küp</h2>
    <p>
      Kapalı el (yumruk) takibi güçlendirildi ve donmaları önlemek için kare hızı optimize edildi.
      Sadece <b>işaret parmağını</b> kaldırıp küpü taşıyabilirsin.
    </p>
    <button id="startBtn">Başlat</button>
    <div id="status">Hazır</div>
  </div>

  <video id="cam" playsinline autoplay muted></video>

  <div id="vr-container">
    <div class="eye">
      <div class="lens-mask">
        <canvas id="leftCanvas"></canvas>
      </div>
    </div>
    <div class="eye">
      <div class="lens-mask">
        <canvas id="rightCanvas"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const video = document.getElementById("cam");

    const leftCanvas = document.getElementById("leftCanvas");
    const rightCanvas = document.getElementById("rightCanvas");
    const leftCtx = leftCanvas.getContext("2d", { alpha: false });
    const rightCtx = rightCanvas.getContext("2d", { alpha: false });
    const lensMasks = document.querySelectorAll(".lens-mask");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let canvasLogicalSize = 280;

    // Son bilinen el pozisyonunu kısa süre koruma (yumrukta anlık kopmaları engeller)
    let cachedLandmarks = [];
    let cachedStates = [];
    let lostFrames = 0;
    const MAX_LOST_FRAMES = 6;

    const eyeOffset = 0.014;

    const cube = {
      x: 0.5,
      y: 0.5,
      size: 0.17,
      grabbed: false,
      grabbedByHand: -1
    };

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
    ];

    function resizeCanvases() {
      // iPhone'da takılmayı önlemek için DPR tavanı 1.5 tutuldu
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvasLogicalSize = Math.floor(lensMasks[0].clientWidth || 280);

      for (const [c, ctx] of [[leftCanvas, leftCtx], [rightCanvas, rightCtx]]) {
        c.width = Math.floor(canvasLogicalSize * dpr);
        c.height = Math.floor(canvasLogicalSize * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    async function initMediaPipe() {
      statusEl.textContent = "El takip modeli yükleniyor...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        // El yumruk olduğunda da takibi sürdürmesi için düşük güven eşikleri
        minHandDetectionConfidence: 0.25,
        minHandPresenceConfidence: 0.25,
        minTrackingConfidence: 0.22
      });
    }

    async function initCamera() {
      statusEl.textContent = "Arka kamera açılıyor...";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 480 },
          height: { ideal: 360 },
          frameRate: { ideal: 60, max: 60 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function analyzePointingHand(hand) {
      const wrist = hand[0];
      const indexMcp = hand[5];
      const indexPip = hand[6];
      const indexTip = hand[8];

      const middlePip = hand[10];
      const middleTip = hand[12];
      const ringPip = hand[14];
      const ringTip = hand[16];
      const pinkyPip = hand[18];
      const pinkyTip = hand[20];

      const indexExtended =
        dist(indexTip, wrist) > dist(indexPip, wrist) * 1.12 &&
        dist(indexTip, wrist) > dist(indexMcp, wrist) * 1.25;

      const middleCurled = dist(middleTip, wrist) < dist(middlePip, wrist) * 1.06;
      const ringCurled = dist(ringTip, wrist) < dist(ringPip, wrist) * 1.06;
      const pinkyCurled = dist(pinkyTip, wrist) < dist(pinkyPip, wrist) * 1.06;

      const isIndexOnlyUp = indexExtended && middleCurled && ringCurled && pinkyCurled;

      return {
        indexX: indexTip.x,
        indexY: indexTip.y,
        isIndexOnlyUp
      };
    }

    function toLensPoint(nx, ny, shiftX, size) {
      const lx = 0.5 + (nx - 0.5) * 0.78 + shiftX;
      const ly = 0.5 + (ny - 0.5) * 0.78;
      return {
        px: lx * size,
        py: ly * size
      };
    }

    function draw3DCube(ctx, shiftX, size) {
      const center = toLensPoint(cube.x, cube.y, shiftX, size);
      const s = cube.size * size;
      const half = s / 2;

      const relX = (center.px - size / 2) / (size / 2);
      const relY = (center.py - size / 2) / (size / 2);
      const dX = s * 0.34 - relX * s * 0.14;
      const dY = -s * 0.34 - relY * s * 0.14;

      const fTL = { x: center.px - half, y: center.py - half };
      const fTR = { x: center.px + half, y: center.py - half };
      const fBR = { x: center.px + half, y: center.py + half };
      const fBL = { x: center.px - half, y: center.py + half };

      const bTL = { x: fTL.x + dX, y: fTL.y + dY };
      const bTR = { x: fTR.x + dX, y: fTR.y + dY };
      const bBR = { x: fBR.x + dX, y: fBR.y + dY };
      const bBL = { x: fBL.x + dX, y: fBL.y + dY };

      const mainColor = cube.grabbed ? "#00f5a0" : "#00b4ff";
      const sideFill = cube.grabbed ? "rgba(0, 245, 160, 0.16)" : "rgba(0, 180, 255, 0.14)";
      const frontFill = cube.grabbed ? "rgba(0, 245, 160, 0.28)" : "rgba(0, 180, 255, 0.24)";

      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      ctx.fillStyle = sideFill;
      ctx.beginPath();
      ctx.moveTo(fTL.x, fTL.y);
      ctx.lineTo(bTL.x, bTL.y);
      ctx.lineTo(bTR.x, bTR.y);
      ctx.lineTo(fTR.x, fTR.y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(fTR.x, fTR.y);
      ctx.lineTo(bTR.x, bTR.y);
      ctx.lineTo(bBR.x, bBR.y);
      ctx.lineTo(fBR.x, fBR.y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = frontFill;
      ctx.fillRect(fTL.x, fTL.y, s, s);

      ctx.strokeStyle = "rgba(0, 180, 255, 0.5)";
      if (cube.grabbed) ctx.strokeStyle = "rgba(0, 245, 160, 0.5)";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(bTL.x, bTL.y, s, s);

      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(fTL.x, fTL.y); ctx.lineTo(bTL.x, bTL.y);
      ctx.moveTo(fTR.x, fTR.y); ctx.lineTo(bTR.x, bTR.y);
      ctx.moveTo(fBR.x, fBR.y); ctx.lineTo(bBR.x, bBR.y);
      ctx.moveTo(fBL.x, fBL.y); ctx.lineTo(bBL.x, bBL.y);
      ctx.stroke();

      ctx.lineWidth = 4.5;
      ctx.strokeRect(fTL.x, fTL.y, s, s);
    }

    function drawScene(ctx, landmarks, handStates, shiftX) {
      const size = canvasLogicalSize;

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, size, size);

      draw3DCube(ctx, shiftX, size);

      if (!landmarks || landmarks.length === 0) return;

      for (let idx = 0; idx < landmarks.length; idx++) {
        const hand = landmarks[idx];
        const st = handStates[idx];
        const pts = hand.map((pt) => toLensPoint(pt.x, pt.y, shiftX, size));

        const lineColor = st.isIndexOnlyUp
          ? "#00f5a0"
          : (idx === 0 ? "#38bdf8" : "#c084fc");

        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.beginPath();
        for (const [a, b] of HAND_CONNECTIONS) {
          ctx.moveTo(pts[a].px, pts[a].py);
          ctx.lineTo(pts[b].px, pts[b].py);
        }
        ctx.stroke();

        for (let i = 0; i < pts.length; i++) {
          const isIndexTip = i === 8;
          const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
          ctx.beginPath();
          ctx.arc(pts[i].px, pts[i].py, isIndexTip && st.isIndexOnlyUp ? 7.5 : (isTip ? 5.5 : 3.5), 0, Math.PI * 2);
          ctx.fillStyle = isIndexTip && st.isIndexOnlyUp ? "#ffffff" : (isTip ? lineColor : "#ffffff");
          ctx.fill();
        }
      }
    }

    function renderLoop() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const result = handLandmarker.detectForVideo(video, now);

        if (result.landmarks && result.landmarks.length > 0) {
          cachedLandmarks = result.landmarks;
          cachedStates = result.landmarks.map((hand) => analyzePointingHand(hand));
          lostFrames = 0;
        } else {
          lostFrames++;
          if (lostFrames > MAX_LOST_FRAMES) {
            cachedLandmarks = [];
            cachedStates = [];
          }
        }

        let movedByAnyHand = false;

        for (let idx = 0; idx < cachedLandmarks.length; idx++) {
          const st = cachedStates[idx];

          if (st.isIndexOnlyUp) {
            const hitRadius = cube.size * 0.82;
            const isOverCube =
              Math.hypot(st.indexX - cube.x, st.indexY - cube.y) <= hitRadius;

            if (!cube.grabbed && isOverCube) {
              cube.grabbed = true;
              cube.grabbedByHand = idx;
            }

            if (cube.grabbed && cube.grabbedByHand === idx) {
              // Yumuşak interpolasyon (titreme olmadan akıcı hareket)
              const targetX = Math.max(0.22, Math.min(0.78, st.indexX));
              const targetY = Math.max(0.22, Math.min(0.78, st.indexY));
              cube.x += (targetX - cube.x) * 0.45;
              cube.y += (targetY - cube.y) * 0.45;
              movedByAnyHand = true;
            }
          } else if (cube.grabbed && cube.grabbedByHand === idx) {
            cube.grabbed = false;
            cube.grabbedByHand = -1;
          }
        }

        if (!movedByAnyHand && cube.grabbedByHand !== -1) {
          const activeSt = cachedStates[cube.grabbedByHand];
          if (!activeSt || !activeSt.isIndexOnlyUp) {
            cube.grabbed = false;
            cube.grabbedByHand = -1;
          }
        }

        drawScene(leftCtx, cachedLandmarks, cachedStates, eyeOffset);
        drawScene(rightCtx, cachedLandmarks, cachedStates, -eyeOffset);
      }

      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        if (!handLandmarker) await initMediaPipe();
        await initCamera();
        ui.style.display = "none";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
