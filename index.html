<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Karton VR - 360° Blok Dünyası v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #07101f;
      padding: 24px;
      text-align: center;
    }
    #ui h2 {
      font-size: 24px;
      color: #38bdf8;
    }
    #ui p {
      max-width: 460px;
      font-size: 15px;
      line-height: 1.5;
      color: #e2e8f0;
    }
    button {
      padding: 15px 28px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      background: #38bdf8;
      color: #04101c;
      cursor: pointer;
    }
    #vr-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      background: #000000;
    }
    .eye {
      position: relative;
      width: 50vw;
      height: 100dvh;
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lens-mask {
      position: relative;
      width: min(84vw, 88dvh);
      height: min(84vw, 88dvh);
      border-radius: 50%;
      overflow: hidden;
      background: #07101f;
      box-shadow: 0 0 0 999px #000000;
      transform: translateZ(0);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Karton VR - 360° Blok Dünyası v2</h2>
    <p>
      Kafa dönüş yönü düzeltildi, el takibi güçlendirildi ve gece mavisi gökyüzü eklendi.<br />
      <b>Pinch</b>: Bloğu kır &nbsp;|&nbsp; <b>Yumruk</b>: Blok yerleştir
    </p>
    <button id="startBtn">Başlat (Kamera + 360° Sensör)</button>
    <div id="status">Hazır</div>
  </div>

  <video id="cam" playsinline autoplay muted></video>

  <div id="vr-container">
    <div class="eye">
      <div class="lens-mask">
        <canvas id="leftCanvas"></canvas>
      </div>
    </div>
    <div class="eye">
      <div class="lens-mask">
        <canvas id="rightCanvas"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const video = document.getElementById("cam");

    const leftCanvas = document.getElementById("leftCanvas");
    const rightCanvas = document.getElementById("rightCanvas");
    const leftCtx = leftCanvas.getContext("2d", { alpha: false });
    const rightCtx = rightCanvas.getContext("2d", { alpha: false });
    const lensMasks = document.querySelectorAll(".lens-mask");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let canvasLogicalSize = 320;

    // El takibi kararlılık tamponu
    let cachedLandmarks = [];
    let cachedStates = [];
    let lostFrames = 0;
    const MAX_LOST_FRAMES = 14;

    const eyeOffset = 0.014;
    const pinchThreshold = 0.065;

    // 360 derece bakış açısı
    let yaw = 0;
    let pitch = 0.15;
    let rawAlpha = null;
    let rawBeta = null;

    const BLOCK_TYPES = [
      { name: "Çimen", top: "#4ade80", left: "#22c55e", right: "#15803d", edge: "#bbf7d0" },
      { name: "Toprak", top: "#d97706", left: "#b45309", right: "#78350f", edge: "#fde68a" },
      { name: "Taş", top: "#cbd5e1", left: "#94a3b8", right: "#64748b", edge: "#f8fafc" },
      { name: "Altın", top: "#fde047", left: "#eab308", right: "#a16207", edge: "#fef9c3" }
    ];
    let selectedTypeIdx = 0;

    // Bloklar: yaw (radyan), dist (derinlik), yOffset (yükseklik), type
    let blocks = [
      { id: 1, yaw: 0.0, dist: 2.6, yOffset: -0.2, type: 0 },
      { id: 2, yaw: 0.32, dist: 2.8, yOffset: -0.2, type: 1 },
      { id: 3, yaw: -0.32, dist: 2.8, yOffset: -0.2, type: 2 },
      { id: 4, yaw: 0.0, dist: 2.6, yOffset: 0.32, type: 3 },
      { id: 5, yaw: 1.57, dist: 2.7, yOffset: -0.1, type: 0 },
      { id: 6, yaw: -1.57, dist: 2.7, yOffset: -0.1, type: 2 },
      { id: 7, yaw: 3.14, dist: 2.6, yOffset: -0.1, type: 3 },
      { id: 8, yaw: 2.5, dist: 2.9, yOffset: -0.2, type: 1 }
    ];
    let nextBlockId = 9;
    let hoveredBlockId = null;

    // Kırma parçacıkları
    let particles = [];

    let prevPinch = false;
    let prevFist = false;
    let actionCooldown = 0;

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
    ];

    function resizeCanvases() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvasLogicalSize = Math.floor(lensMasks[0].clientWidth || 320);

      for (const [c, ctx] of [[leftCanvas, leftCtx], [rightCanvas, rightCtx]]) {
        c.width = Math.floor(canvasLogicalSize * dpr);
        c.height = Math.floor(canvasLogicalSize * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    async function initSensors() {
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (_) {}
      }

      window.addEventListener("deviceorientation", (e) => {
        if (e.alpha === null) return;
        const alphaRad = (e.alpha * Math.PI) / 180;
        const betaRad = ((e.beta ?? 90) * Math.PI) / 180;

        if (rawAlpha === null) {
          rawAlpha = alphaRad;
          rawBeta = betaRad;
        }

        // Sağ/sol dönüş yönü düzeltildi
        let dAlpha = rawAlpha - alphaRad;
        while (dAlpha > Math.PI) dAlpha -= Math.PI * 2;
        while (dAlpha < -Math.PI) dAlpha += Math.PI * 2;

        yaw = dAlpha;
        pitch = Math.max(-0.65, Math.min(0.65, (betaRad - rawBeta) * 0.65 + 0.15));
      });
    }

    async function initMediaPipe() {
      statusEl.textContent = "El takip modeli yükleniyor...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.2,
        minHandPresenceConfidence: 0.2,
        minTrackingConfidence: 0.18
      });
    }

    async function initCamera() {
      statusEl.textContent = "Arka kamera açılıyor...";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 480 },
          height: { ideal: 360 },
          frameRate: { ideal: 60, max: 60 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function analyzeHand(hand) {
      const wrist = hand[0];
      const thumbTip = hand[4];
      const indexMcp = hand[5];
      const indexPip = hand[6];
      const indexTip = hand[8];

      const middlePip = hand[10];
      const middleTip = hand[12];
      const ringPip = hand[14];
      const ringTip = hand[16];
      const pinkyPip = hand[18];
      const pinkyTip = hand[20];

      const indexExtended =
        dist(indexTip, wrist) > dist(indexPip, wrist) * 1.08 &&
        dist(indexTip, wrist) > dist(indexMcp, wrist) * 1.18;

      const middleCurled = dist(middleTip, wrist) < dist(middlePip, wrist) * 1.08;
      const ringCurled = dist(ringTip, wrist) < dist(ringPip, wrist) * 1.08;
      const pinkyCurled = dist(pinkyTip, wrist) < dist(pinkyPip, wrist) * 1.08;

      const isPointing = indexExtended && middleCurled && ringCurled && pinkyCurled;
      const isPinching = dist(thumbTip, indexTip) < pinchThreshold;

      const avgTipToWrist =
        (dist(indexTip, wrist) +
          dist(middleTip, wrist) +
          dist(ringTip, wrist) +
          dist(pinkyTip, wrist)) / 4;

      const isFist = !isPinching && avgTipToWrist < 0.175;

      return {
        indexX: indexTip.x,
        indexY: indexTip.y,
        isPointing,
        isPinching,
        isFist
      };
    }

    // Önceki el noktalarıyla yumuşak birleştirme (titreme ve kopma azaltıcı)
    function smoothLandmarks(newLandmarks) {
      if (!cachedLandmarks || cachedLandmarks.length !== newLandmarks.length) {
        return newLandmarks;
      }
      return newLandmarks.map((hand, hIdx) => {
        const prevHand = cachedLandmarks[hIdx];
        return hand.map((pt, pIdx) => {
          const prev = prevHand[pIdx] || pt;
          return {
            x: prev.x + (pt.x - prev.x) * 0.65,
            y: prev.y + (pt.y - prev.y) * 0.65,
            z: pt.z
          };
        });
      });
    }

    function toLensPoint(nx, ny, shiftX, size) {
      const lx = 0.5 + (nx - 0.5) * 0.96 + shiftX;
      const ly = 0.5 + (ny - 0.5) * 0.96;
      return {
        px: lx * size,
        py: ly * size
      };
    }

    function projectBlock(block, shiftX, size) {
      let relYaw = block.yaw - yaw;
      while (relYaw > Math.PI) relYaw -= Math.PI * 2;
      while (relYaw < -Math.PI) relYaw += Math.PI * 2;

      const fovHalf = 1.2;
      if (Math.abs(relYaw) > fovHalf + 0.35) {
        return null;
      }

      const sx = (0.5 + (relYaw / fovHalf) * 0.44 + shiftX) * size;
      const sy = (0.5 + (block.yOffset - pitch * 0.45) * 0.45) * size;
      const boxSize = Math.max(26, (size * 0.2) / (block.dist * 0.35));

      return { sx, sy, boxSize };
    }

    function spawnParticles(block, color) {
      for (let i = 0; i < 10; i++) {
        const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.3;
        const speed = 1.5 + Math.random() * 2.5;
        particles.push({
          yaw: block.yaw + (Math.random() - 0.5) * 0.12,
          yOffset: block.yOffset + (Math.random() - 0.5) * 0.12,
          dist: block.dist,
          vx: Math.cos(angle) * speed * 0.015,
          vy: Math.sin(angle) * speed * 0.015,
          color,
          life: 18
        });
      }
    }

    function updateParticles() {
      for (const p of particles) {
        p.yaw += p.vx;
        p.yOffset += p.vy - 0.002;
        p.life--;
      }
      particles = particles.filter((p) => p.life > 0);
    }

    function drawBackground(ctx, size) {
      // Siyah yerine gece gökyüzü gradyanı ve ufuk çizgisi
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, "#071326");
      grad.addColorStop(0.55, "#102a43");
      grad.addColorStop(1, "#1b362d");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      const horizonY = size * (0.54 - pitch * 0.25);
      ctx.strokeStyle = "rgba(125, 211, 252, 0.22)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, horizonY);
      ctx.lineTo(size, horizonY);
      ctx.stroke();
    }

    function drawMinecraftBlock(ctx, proj, typeIdx, isHighlighted) {
      const t = BLOCK_TYPES[typeIdx % BLOCK_TYPES.length];
      const s = proj.boxSize;
      const half = s / 2;
      const dX = s * 0.36;
      const dY = -s * 0.32;

      const fTL = { x: proj.sx - half, y: proj.sy - half };
      const fTR = { x: proj.sx + half, y: proj.sy - half };
      const fBR = { x: proj.sx + half, y: proj.sy + half };
      const fBL = { x: proj.sx - half, y: proj.sy + half };

      const bTL = { x: fTL.x + dX, y: fTL.y + dY };
      const bTR = { x: fTR.x + dX, y: fTR.y + dY };
      const bBR = { x: fBR.x + dX, y: fBR.y + dY };

      ctx.lineJoin = "round";

      // Üst yüz
      ctx.fillStyle = t.top;
      ctx.beginPath();
      ctx.moveTo(fTL.x, fTL.y);
      ctx.lineTo(bTL.x, bTL.y);
      ctx.lineTo(bTR.x, bTR.y);
      ctx.lineTo(fTR.x, fTR.y);
      ctx.closePath();
      ctx.fill();

      // Sağ yan yüz
      ctx.fillStyle = t.right;
      ctx.beginPath();
      ctx.moveTo(fTR.x, fTR.y);
      ctx.lineTo(bTR.x, bTR.y);
      ctx.lineTo(bBR.x, bBR.y);
      ctx.lineTo(fBR.x, fBR.y);
      ctx.closePath();
      ctx.fill();

      // Ön yüz
      ctx.fillStyle = t.left;
      ctx.fillRect(fTL.x, fTL.y, s, s);

      // Kenar çizgileri
      ctx.strokeStyle = isHighlighted ? "#ffffff" : t.edge;
      ctx.lineWidth = isHighlighted ? 4.5 : 2.5;
      ctx.strokeRect(fTL.x, fTL.y, s, s);

      ctx.beginPath();
      ctx.moveTo(fTL.x, fTL.y); ctx.lineTo(bTL.x, bTL.y);
      ctx.moveTo(fTR.x, fTR.y); ctx.lineTo(bTR.x, bTR.y);
      ctx.moveTo(fBR.x, fBR.y); ctx.lineTo(bBR.x, bBR.y);
      ctx.stroke();

      // Seçili blokta üst köşede nişan işareti
      if (isHighlighted) {
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(fTL.x - 5, fTL.y - 5, s + 10, s + 10);
      }
    }

    function drawScene(ctx, landmarks, handStates, shiftX) {
      const size = canvasLogicalSize;

      drawBackground(ctx, size);

      const projected = [];
      for (const b of blocks) {
        const p = projectBlock(b, shiftX, size);
        if (p) projected.push({ block: b, proj: p });
      }
      projected.sort((a, b) => b.block.dist - a.block.dist);

      for (const item of projected) {
        drawMinecraftBlock(ctx, item.proj, item.block.type, item.block.id === hoveredBlockId);
      }

      // Parçacıklar
      for (const p of particles) {
        const proj = projectBlock(p, shiftX, size);
        if (!proj) continue;
        ctx.fillStyle = p.color;
        ctx.fillRect(proj.sx - 4, proj.sy - 4, 8, 8);
      }

      if (!landmarks || landmarks.length === 0) return;

      for (let idx = 0; idx < landmarks.length; idx++) {
        const hand = landmarks[idx];
        const st = handStates[idx];
        const pts = hand.map((pt) => toLensPoint(pt.x, pt.y, shiftX, size));

        const lineColor = st.isPinching
          ? "#fb7185"
          : st.isFist
            ? "#facc15"
            : st.isPointing
              ? "#38bdf8"
              : "#4ade80";

        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.beginPath();
        for (const [a, b] of HAND_CONNECTIONS) {
          ctx.moveTo(pts[a].px, pts[a].py);
          ctx.lineTo(pts[b].px, pts[b].py);
        }
        ctx.stroke();

        for (let i = 0; i < pts.length; i++) {
          const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
          ctx.beginPath();
          ctx.arc(pts[i].px, pts[i].py, isTip ? 6 : 3.5, 0, Math.PI * 2);
          ctx.fillStyle = isTip ? lineColor : "#ffffff";
          ctx.fill();
        }
      }
    }

    function handleInteractions(handStates) {
      if (actionCooldown > 0) actionCooldown--;

      hoveredBlockId = null;
      let anyPinch = false;
      let anyFist = false;
      let pointerNorm = null;

      for (const st of handStates) {
        if (!pointerNorm && (st.isPointing || st.isPinching || st.isFist)) {
          pointerNorm = { x: st.indexX, y: st.indexY };
        }
        if (st.isPinching) anyPinch = true;
        if (st.isFist) anyFist = true;
      }

      if (pointerNorm) {
        const px = pointerNorm.x * canvasLogicalSize;
        const py = pointerNorm.y * canvasLogicalSize;

        for (const b of blocks) {
          const proj = projectBlock(b, 0, canvasLogicalSize);
          if (!proj) continue;
          const hitDist = Math.hypot(px - proj.sx, py - proj.sy);
          if (hitDist <= proj.boxSize * 0.85) {
            hoveredBlockId = b.id;
            break;
          }
        }
      }

      // Pinch ile blok kırma
      if (anyPinch && !prevPinch && actionCooldown === 0 && hoveredBlockId !== null) {
        const targetBlock = blocks.find((b) => b.id === hoveredBlockId);
        if (targetBlock) {
          spawnParticles(targetBlock, BLOCK_TYPES[targetBlock.type % BLOCK_TYPES.length].top);
        }
        blocks = blocks.filter((b) => b.id !== hoveredBlockId);
        hoveredBlockId = null;
        actionCooldown = 14;
      }

      // Yumruk ile yeni blok yerleştirme
      if (anyFist && !prevFist && actionCooldown === 0) {
        const placeYaw = pointerNorm
          ? yaw + (pointerNorm.x - 0.5) * 1.5
          : yaw;
        const placeYOffset = pointerNorm
          ? pitch * 0.45 + (pointerNorm.y - 0.5) * 0.85
          : -0.15;

        blocks.push({
          id: nextBlockId++,
          yaw: placeYaw,
          dist: 2.55,
          yOffset: Math.max(-0.5, Math.min(0.5, placeYOffset)),
          type: selectedTypeIdx
        });
        selectedTypeIdx = (selectedTypeIdx + 1) % BLOCK_TYPES.length;
        actionCooldown = 16;
      }

      prevPinch = anyPinch;
      prevFist = anyFist;
    }

    function renderLoop() {
      updateParticles();

      if (handLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const result = handLandmarker.detectForVideo(video, now);

        if (result.landmarks && result.landmarks.length > 0) {
          const smoothed = smoothLandmarks(result.landmarks);
          cachedLandmarks = smoothed;
          cachedStates = smoothed.map((hand) => analyzeHand(hand));
          lostFrames = 0;
        } else {
          lostFrames++;
          if (lostFrames > MAX_LOST_FRAMES) {
            cachedLandmarks = [];
            cachedStates = [];
          }
        }
      }

      handleInteractions(cachedStates);
      drawScene(leftCtx, cachedLandmarks, cachedStates, eyeOffset);
      drawScene(rightCtx, cachedLandmarks, cachedStates, -eyeOffset);

      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        await initSensors();
        if (!handLandmarker) await initMediaPipe();
        await initCamera();
        ui.style.display = "none";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
