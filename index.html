<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Karton VR - Sadece Eller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000000;
      padding: 24px;
      text-align: center;
    }
    #ui h2 {
      font-size: 24px;
      color: #00f5a0;
    }
    #ui p {
      max-width: 420px;
      font-size: 16px;
      line-height: 1.5;
      color: #d8e2ee;
    }
    button {
      padding: 15px 30px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      background: #00f5a0;
      color: #000000;
      cursor: pointer;
    }
    #vr-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      background: #000000;
    }
    .eye {
      position: relative;
      width: 50vw;
      height: 100dvh;
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lens-mask {
      position: relative;
      width: min(70vw, 75dvh);
      height: min(70vw, 75dvh);
      border-radius: 50%;
      overflow: hidden;
      background: #000000;
      box-shadow: 0 0 0 999px #000000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
    }
    video { display: none; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Karton VR - Sadece Eller</h2>
    <p>
      Arka plan tamamen siyah. Gözlük içinde sadece kendi ellerinin neon iskeleti ve parmak hareketleri görünür.
    </p>
    <button id="startBtn">Başlat</button>
    <div id="status">Hazır</div>
  </div>

  <video id="cam" playsinline autoplay muted></video>

  <div id="vr-container">
    <div class="eye">
      <div class="lens-mask">
        <canvas id="leftCanvas"></canvas>
      </div>
    </div>
    <div class="eye">
      <div class="lens-mask">
        <canvas id="rightCanvas"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const video = document.getElementById("cam");

    const leftCanvas = document.getElementById("leftCanvas");
    const rightCanvas = document.getElementById("rightCanvas");
    const leftCtx = leftCanvas.getContext("2d");
    const rightCtx = rightCanvas.getContext("2d");
    const lensMasks = document.querySelectorAll(".lens-mask");

    let handLandmarker = null;
    let lastVideoTime = -1;

    const eyeOffset = 0.014;
    const pinchThreshold = 0.06;

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
    ];

    function resizeCanvases() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const maskSize = Math.floor(lensMasks[0].clientWidth || 280);

      for (const [c, ctx] of [[leftCanvas, leftCtx], [rightCanvas, rightCtx]]) {
        c.width = Math.floor(maskSize * dpr);
        c.height = Math.floor(maskSize * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    async function initMediaPipe() {
      statusEl.textContent = "El takip modeli yükleniyor...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
    }

    async function initCamera() {
      statusEl.textContent = "Arka kamera açılıyor...";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    function getHandStyle(hand, idx) {
      const wrist = hand[0];
      const thumbTip = hand[4];
      const indexTip = hand[8];
      const middleTip = hand[12];
      const ringTip = hand[16];
      const pinkyTip = hand[20];

      const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      const isPinching = pinchDist < pinchThreshold;

      const avgTipToWrist =
        (Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y) +
          Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y) +
          Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y) +
          Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y)) / 4;

      const isFist = avgTipToWrist < 0.16;

      if (isPinching) {
        return { line: "#00f5a0", joint: "#ffffff", tip: "#00f5a0" };
      }
      if (isFist) {
        return { line: "#ff3b6b", joint: "#ffd6e0", tip: "#ff3b6b" };
      }
      return idx === 0
        ? { line: "#00e5ff", joint: "#ffffff", tip: "#00e5ff" }
        : { line: "#c77dff", joint: "#ffffff", tip: "#c77dff" };
    }

    function toLensPoint(nx, ny, shiftX, size) {
      const lx = 0.5 + (nx - 0.5) * 0.78 + shiftX;
      const ly = 0.5 + (ny - 0.5) * 0.78;
      return {
        px: lx * size,
        py: ly * size
      };
    }

    function drawHandsOnly(ctx, landmarks, shiftX) {
      const size = Math.floor(lensMasks[0].clientWidth || 280);

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, size, size);

      if (!landmarks || landmarks.length === 0) return;

      landmarks.forEach((hand, idx) => {
        const style = getHandStyle(hand, idx);
        const pts = hand.map((pt) => toLensPoint(pt.x, pt.y, shiftX, size));

        ctx.strokeStyle = style.line;
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.beginPath();
        for (const [a, b] of HAND_CONNECTIONS) {
          ctx.moveTo(pts[a].px, pts[a].py);
          ctx.lineTo(pts[b].px, pts[b].py);
        }
        ctx.stroke();

        for (let i = 0; i < pts.length; i++) {
          const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
          ctx.beginPath();
          ctx.arc(pts[i].px, pts[i].py, isTip ? 6.5 : 4, 0, Math.PI * 2);
          ctx.fillStyle = isTip ? style.tip : style.joint;
          ctx.fill();
        }
      });
    }

    function renderLoop() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const result = handLandmarker.detectForVideo(video, now);

        drawHandsOnly(leftCtx, result.landmarks, eyeOffset);
        drawHandsOnly(rightCtx, result.landmarks, -eyeOffset);
      }
      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        if (!handLandmarker) await initMediaPipe();
        await initCamera();
        ui.style.display = "none";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
