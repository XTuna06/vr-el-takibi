<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Karton VR Net - iPhone SBS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000000;
      padding: 24px;
      text-align: center;
    }
    #ui h2 {
      font-size: 24px;
      color: #00f5a0;
    }
    #ui p {
      max-width: 440px;
      font-size: 16px;
      line-height: 1.5;
      color: #e5ecf4;
    }
    button {
      padding: 15px 28px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      background: #00f5a0;
      color: #000000;
      cursor: pointer;
    }
    .mini-btn {
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 10px;
      background: #1d2430;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    #vr-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      background: #000000;
    }
    .eye {
      position: relative;
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }
    .eye:first-child {
      border-right: 2px solid #222834;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .eye-hud {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(12, 16, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      pointer-events: none;
    }
    .eye-controls {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 8px;
      background: rgba(12, 16, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 6px 10px;
      border-radius: 12px;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }
    video { display: none; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Karton VR Net Mod</h2>
    <p>
      Bulanık kamera arka planı kapatıldı. Gözlük içinde mercek merkezine odaklı parlak hedef, küp ve el göstergeleri çalışır.
    </p>
    <button id="startBtn">Başlat</button>
    <div id="status">Hazır</div>
  </div>

  <video id="cam" playsinline autoplay muted></video>

  <div id="vr-container">
    <div class="eye">
      <div class="eye-hud" id="hudLeft">Skor: 0 | El: 0</div>
      <canvas id="leftCanvas"></canvas>
      <div class="eye-controls">
        <button class="mini-btn" id="ipdMinusL">-</button>
        <span class="ipdVal">IPD: 0.015</span>
        <button class="mini-btn" id="ipdPlusL">+</button>
      </div>
    </div>
    <div class="eye">
      <div class="eye-hud" id="hudRight">Skor: 0 | El: 0</div>
      <canvas id="rightCanvas"></canvas>
      <div class="eye-controls">
        <button class="mini-btn" id="ipdMinusR">-</button>
        <span class="ipdVal">IPD: 0.015</span>
        <button class="mini-btn" id="ipdPlusR">+</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const hudLeft = document.getElementById("hudLeft");
    const hudRight = document.getElementById("hudRight");
    const video = document.getElementById("cam");

    const leftCanvas = document.getElementById("leftCanvas");
    const rightCanvas = document.getElementById("rightCanvas");
    const leftCtx = leftCanvas.getContext("2d");
    const rightCtx = rightCanvas.getContext("2d");
    const ipdVals = document.querySelectorAll(".ipdVal");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let score = 0;

    let eyeOffset = 0.015;
    const pinchThreshold = 0.062;

    // Mercek merkezine yakın konumlar (0.5 merkez)
    let target = {
      x: 0.56,
      y: 0.46,
      vx: 0.0012,
      vy: 0.0009,
      radius: 0.085
    };

    let cube = {
      x: 0.42,
      y: 0.56,
      size: 0.14,
      grabbed: false
    };

    let prevPinching = [false, false];

    function updateIpdUI() {
      ipdVals.forEach((el) => {
        el.textContent = `IPD: ${eyeOffset.toFixed(3)}`;
      });
    }

    function changeIpd(delta) {
      eyeOffset = Math.max(0.0, Math.min(0.05, +(eyeOffset + delta).toFixed(3)));
      updateIpdUI();
    }

    document.getElementById("ipdMinusL").addEventListener("click", () => changeIpd(-0.004));
    document.getElementById("ipdPlusL").addEventListener("click", () => changeIpd(0.004));
    document.getElementById("ipdMinusR").addEventListener("click", () => changeIpd(-0.004));
    document.getElementById("ipdPlusR").addEventListener("click", () => changeIpd(0.004));
    updateIpdUI();

    function resizeCanvases() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const cssW = Math.floor(window.innerWidth / 2);
      const cssH = window.innerHeight;

      for (const [c, ctx] of [[leftCanvas, leftCtx], [rightCanvas, rightCtx]]) {
        c.width = Math.floor(cssW * dpr);
        c.height = Math.floor(cssH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    async function initMediaPipe() {
      statusEl.textContent = "El takip modeli yükleniyor...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
    }

    async function initCamera() {
      statusEl.textContent = "Arka kamera açılıyor...";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    function analyzeHand(hand) {
      const wrist = hand[0];
      const thumbTip = hand[4];
      const indexTip = hand[8];
      const middleTip = hand[12];
      const ringTip = hand[16];
      const pinkyTip = hand[20];

      const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      const isPinching = pinchDist < pinchThreshold;

      const avgTipToWrist =
        (Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y) +
          Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y) +
          Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y) +
          Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y)) / 4;

      const isFist = avgTipToWrist < 0.16;
      const gesture = isPinching ? "Pinch" : isFist ? "Yumruk" : "Açık";

      return {
        indexX: indexTip.x,
        indexY: indexTip.y,
        isPinching,
        isFist,
        gesture
      };
    }

    function updateWorld() {
      target.x += target.vx;
      target.y += target.vy;
      if (target.x < 0.36 || target.x > 0.64) target.vx *= -1;
      if (target.y < 0.38 || target.y > 0.62) target.vy *= -1;
    }

    // Mercek ortasına odaklanmış koordinat dönüştürücü
    function toLensSpace(nx, ny, shiftX, w, h) {
      const cx = 0.5 + (nx - 0.5) * 0.52 + shiftX;
      const cy = 0.5 + (ny - 0.5) * 0.45;
      return {
        px: Math.max(0.12, Math.min(0.88, cx)) * w,
        py: Math.max(0.22, Math.min(0.78, cy)) * h
      };
    }

    function drawEye(ctx, landmarks, handStates, shiftX) {
      const w = Math.floor(window.innerWidth / 2);
      const h = window.innerHeight;

      // Tam siyah arka plan (OLED netliği)
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, w, h);

      // Merkez nişan halkası (gözün odaklanacağı referans)
      const centerX = (0.5 + shiftX) * w;
      const centerY = 0.5 * h;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(centerX, centerY, Math.min(w, h) * 0.18, 0, Math.PI * 2);
      ctx.stroke();

      // Hedef halka
      const tPos = toLensSpace(target.x, target.y, shiftX, w, h);
      const tr = target.radius * Math.min(w, h) * 0.7;
      ctx.beginPath();
      ctx.arc(tPos.px, tPos.py, tr, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 214, 0, 0.25)";
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#ffd600";
      ctx.stroke();

      // Küp
      const cPos = toLensSpace(cube.x, cube.y, shiftX, w, h);
      const cSize = cube.size * Math.min(w, h) * 0.7;
      ctx.fillStyle = cube.grabbed ? "rgba(0, 245, 160, 0.35)" : "rgba(255, 107, 53, 0.35)";
      ctx.fillRect(cPos.px - cSize / 2, cPos.py - cSize / 2, cSize, cSize);
      ctx.lineWidth = 5;
      ctx.strokeStyle = cube.grabbed ? "#00f5a0" : "#ff6b35";
      ctx.strokeRect(cPos.px - cSize / 2, cPos.py - cSize / 2, cSize, cSize);

      // El işaret parmağı ve ana eklemler (kalın ve net)
      if (landmarks && landmarks.length > 0) {
        landmarks.forEach((hand, idx) => {
          const st = handStates[idx];

          // Sadece bilek (0) ve parmak uçları (4, 8, 12, 16, 20) - kalabalık yapmadan net görünüm
          const keyIndices = [0, 4, 8, 12, 16, 20];
          ctx.fillStyle = idx === 0 ? "#00e5ff" : "#c77dff";
          for (const k of keyIndices) {
            const pt = hand[k];
            const kPos = toLensSpace(pt.x, pt.y, shiftX, w, h);
            ctx.beginPath();
            ctx.arc(kPos.px, kPos.py, 6, 0, Math.PI * 2);
            ctx.fill();
          }

          const fPos = toLensSpace(st.indexX, st.indexY, shiftX, w, h);
          ctx.beginPath();
          ctx.arc(fPos.px, fPos.py, st.isPinching ? 18 : 13, 0, Math.PI * 2);
          ctx.fillStyle = st.isPinching ? "#00f5a0" : "#ff2e63";
          ctx.fill();
        });
      }
    }

    function renderLoop() {
      updateWorld();

      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const result = handLandmarker.detectForVideo(video, now);

        const handStates = [];
        let activeGesture = "Yok";

        if (result.landmarks && result.landmarks.length > 0) {
          result.landmarks.forEach((hand, idx) => {
            const st = analyzeHand(hand);
            handStates.push(st);
            if (idx === 0) activeGesture = st.gesture;

            const hitTarget =
              Math.hypot(st.indexX - target.x, st.indexY - target.y) < target.radius + 0.06;
            if (st.isPinching && !prevPinching[idx] && hitTarget) {
              score += 1;
              target.x = 0.4 + Math.random() * 0.2;
              target.y = 0.42 + Math.random() * 0.16;
            }

            const nearCube =
              Math.abs(st.indexX - cube.x) < cube.size * 0.95 &&
              Math.abs(st.indexY - cube.y) < cube.size * 0.95;

            if (st.isPinching && !prevPinching[idx] && nearCube) {
              cube.grabbed = true;
            }
            if (cube.grabbed && st.isPinching) {
              cube.x = Math.max(0.32, Math.min(0.68, st.indexX));
              cube.y = Math.max(0.35, Math.min(0.65, st.indexY));
            }
            if (!st.isPinching && cube.grabbed) {
              cube.grabbed = false;
            }

            if (st.isFist && nearCube) {
              score += 2;
              cube.x = 0.38 + Math.random() * 0.24;
              cube.y = 0.4 + Math.random() * 0.2;
              cube.grabbed = false;
            }

            prevPinching[idx] = st.isPinching;
          });

          for (let i = result.landmarks.length; i < 2; i++) {
            prevPinching[i] = false;
          }
        } else {
          prevPinching = [false, false];
          cube.grabbed = false;
        }

        const handCount = result.landmarks ? result.landmarks.length : 0;
        const text = `Skor: ${score} | El: ${handCount} | ${activeGesture}${cube.grabbed ? " (Tutuldu)" : ""}`;
        hudLeft.textContent = text;
        hudRight.textContent = text;

        drawEye(leftCtx, result.landmarks, handStates, eyeOffset);
        drawEye(rightCtx, result.landmarks, handStates, -eyeOffset);
      }

      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        if (!handLandmarker) await initMediaPipe();
        await initCamera();
        ui.style.display = "none";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
